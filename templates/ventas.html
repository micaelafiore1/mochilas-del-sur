<!DOCTYPE html>

<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">


<title>Mochilas del Sur - Ventas</title>

<link rel="stylesheet"
      href="{{ url_for('static', filename='css/style.css') }}">


</head>

<body>


<div class="dashboard">

    <header class="header">

        <div>
            <h1>Mochilas del Sur</h1>
            <p>Registro de ventas</p>
        </div>

        <div class="usuario">

            <span>
                {{ session["usuario"] }} -
                {{ session["rol"] }}
            </span>

            <a href="{{ url_for('logout') }}">
                Cerrar sesión
            </a>

        </div>

    </header>


    <main class="contenido">

        <div class="titulo-seccion">

            <div>
                <h2>Nueva venta</h2>
                <p>Registrar una venta y actualizar el stock</p>
            </div>

            <a href="{{ url_for('inicio') }}" class="boton-volver">
                Volver al inicio
            </a>

        </div>


        {% if error %}
            <p class="error">{{ error }}</p>
        {% endif %}


        <div class="formulario-container">

            <form method="POST">

                <label for="producto_id">
                    Producto
                </label>

                <select id="producto_id" name="producto_id" required>

                    <option value="">
                        Seleccioná un producto
                    </option>

                    {% for producto in productos %}

                    <option value="{{ producto['id'] }}">

                        {{ producto["modelo"] }}
                        -
                        {{ producto["color"] }}
                        -
                        Stock: {{ producto["stock"] }}

                    </option>

                    {% endfor %}

                </select>


                <label for="cantidad">
                    Cantidad
                </label>

                <input
                    type="number"
                    id="cantidad"
                    name="cantidad"
                    min="1"
                    required
                >


                <button type="submit">
                    Registrar venta
                </button>

            </form>

        </div>

    </main>

</div>


</body>
</html>
